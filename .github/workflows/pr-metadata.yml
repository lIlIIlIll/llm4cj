name: PR metadata

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  evaluate:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Evaluate pull-request metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_metadata.py --event "$GITHUB_EVENT_PATH"
