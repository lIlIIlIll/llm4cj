name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: provider-smoke
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dialect: [openai-responses, openai-chat, anthropic-messages, deepseek-responses, deepseek-chat, deepseek-messages]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Verify protected main candidate
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${TRUSTED_SHA}"
          test "${REQUESTED_SHA}" = "${TRUSTED_SHA}"
      - name: Setup latest stable Cangjie
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: sts
          version: latest
      - name: Build public codec probe
        working-directory: support/provider_probe
        run: cjpm build
      - name: Run protected-main provider smoke
        env:
          DIALECT: ${{ matrix.dialect }}
          PROVIDER_SMOKE_CONFIG: ${{ secrets.PROVIDER_SMOKE_CONFIG }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: scripts/provider_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-smoke-${{ matrix.dialect }}
          path: provider-smoke-${{ matrix.dialect }}.json
          if-no-files-found: error
