name: Provider Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit SHA
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dialect: [openai-responses, openai-chat, anthropic-messages, deepseek-responses, deepseek-chat, deepseek-messages]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - name: Run secret-safe provider smoke
        env:
          DIALECT: ${{ matrix.dialect }}
          PROVIDER_SMOKE_CONFIG: ${{ secrets.PROVIDER_SMOKE_CONFIG }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: scripts/provider_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-smoke-${{ matrix.dialect }}
          path: provider-smoke-result.json
          if-no-files-found: error
