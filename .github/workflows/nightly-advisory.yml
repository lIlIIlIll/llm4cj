name: Nightly advisory

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: nightly
        run: echo "version=$(python3 scripts/latest_cangjie_nightly.py)" >> "$GITHUB_OUTPUT"
      - uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: nightly
          version: ${{ steps.nightly.outputs.version }}
      - run: scripts/check.sh
